name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Unit tests cover db.py / query.py / offers.py (stdlib only).
      # Avoid installing the 2018 app pin set here — it is unrelated to these tests.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7.0,<9"
      - name: Run unit tests
        run: pytest -q
